
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <title>Movie Explorer</title>
</head>

<body class="min-h-screen p-6 text-[#f5f1ee] bg-[#2e1f1b]">

    <h1 class="text-4xl font-bold text-center text-[#f5f1ee] mb-8">
      movie search
    </h1>

    <div class="flex flex-col md:flex-row justify-center items-center gap-4 mb-8">

        <input
            id="searchInput"
            type="text"
            placeholder="Search movie..."
            class="w-ful md:w-80 p-3 rounded-x1 bg-[5eb4b43] border border-[#7a6258] text-white 
            placeholder-gray-300 focu:outline-none "
        >

        <select
            id="genreFilter"
            class="p-3 ronded-xl bg-[#7a6258] text-white"
        >
            <option value="all">All Genres</option>
            <option value="Fantasy">Fantasy</option>
            <option value="Animation">Animation</option>
            <option value="Drama">Drama</option>
            <option value="Action">Action</option>
            <option value="Romance">Romance</option>
            <option value="Sci-Fi">Sci-Fi</option>
            <option value="Mystery">Mystery</option>
            <option value="Comedy">Comedy</option>
            <option value="Adventure">Adventure</option>
        </select>

        <button
            id="topRated"
            class="bg-blue-600 text-white px-5 py-3 rounded-lg hover:bg-blue-700 transition"
        >
            ⭐ Top Rated
        </button>

    </div>

    <div
        id="movieContainer"
        class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"
    ></div>

    <script src="script.js"></script>

</body>
</html>
