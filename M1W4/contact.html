<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    
    <style type="text/tailwindcss">
        @custom-variant dark (&:where(.dark, .dark *));
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
     
    <title>Contact</title>
    <link rel="stylesheet" href="style.css">
</head>


<body class="bg-white text-black
 dark:bg-zinc-900 dark:text-white">

<header class="bg-teal-800 text-black
 dark:bg-zinc-900 dark:text-white">
   
    <nav class="flex flex-col md:flex-row justify-between items-center p-4">
        <span>Nunush</span>

        <div>
            <a href="index.html">Home</a>
            <a href="projects.html">Projects</a>
            <a href="contact.html">Contact</a>
        </div>
        <button id="theme-toggle" class="bg-gray-500">Toggle theme</button>
    </nav>
</header>

 
<main  class="contact-box">

     <h1  class="text-4xl md:text-5xlfont-bold
      text-center my-8">
      Contact Me
     </h1>

    <section>
        <form>

            <label for="pname">Name</label>
            <input type="text" id="pname" name="pname" placeholder="( example : Jamson Chris )">

            <br><br>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder=" jamson1248@gmail.com">
            <br><br>

            <label for="phone">Phone number</label>
            <input type="tel" id="phone" name="phone" placeholder="+251 9...">

            <br><br>

            <label for="message">Message</label>
            <textarea id="message" name="message"></textarea>

            <br><br>

            <button type="submit"
             class="bg-teal-900 text-black px-4 py-3
              rounded-full hover:bg-blue-800 transition duration-300">Send</button>

        </form>
    </section>
</main>

<footer class="text-center p-3">
    <p> &copy; 2026 Nunush</p>
</footer>

<script>
  const root = document.documentElement;
  const saved = localStorage.getItem("theme");
  if (saved === "dark") root.classList.add("dark");
 
  document.getElementById("theme-toggle").addEventListener("click", () => {
    root.classList.toggle("dark");
    localStorage.setItem("theme", root.classList.contains("dark") ? "dark" : "light");
  });
</script>

</body>
                </html>
