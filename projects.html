<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
     
    <style type="text/tailwindcss">
        @custom-variant dark (&:where(.dark, .dark *));
    </style>
    
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
      
    <title>Projects</title>
    <link rel="stylesheet" href="style.css">
</head>


<body class="bg-white text-black
 dark:bg-zinc-900 dark:text-white">

<header class="bg-teal-800 text-black
 dark:bg-zinc-900 dark:text-white">
   
    <nav class="flex flex-col md:flex-row justify-between items-center p-4">
        <span>Nunush</span>

        <div>
            <a href="index.html">Home</a>
            <a href="projects.html">Projects</a>
            <a href="contact.html">Contact</a>
        </div>
        <button id="theme-toggle" class="bg-gray-500">Toggle theme</button>
    </nav>
</header>

     

<main>

     <h1  class="text-4xl md:text-5xlfont-bold
      text-center my-8">My Projects
     </h1>

    <section class="projects">
      

        <article class="bg-white dark:bg-slate-800
         text-slate-900 dark:text-white border
          border-slate-300 dark:border-slate-700
           rounded-lg p-6 m shadow">
            <h2>Student Record Management System</h2>
            <p>A BST project written in C++.</p>
        </article>

        <article class="bg-white dark:bg-slate-800 
        text-slate-900 dark:text-white border
         border-slate-300 dark:border-slate-700
          rounded-lg p-5 shadow">
        
            <h2>Blog Website</h2>
            <p>A responsive blog built with HTML, CSS and JavaScript.</p>
        </article>

        <article class="bg-white dark:bg-slate-800
         text-slate-900 dark:text-white border
          border-slate-300 dark:border-slate-700 
          rounded-lg p-5 shadow">
            <h2>To do list</h2>
            <p>To do list web app built  with HTML, CSS and JavaScript.  </p>
        </article>

    </section>
</main>

<footer class="text-center p-3">
    <p>&copy; 2026 Nunush</p>
</footer>

<script>
  const root = document.documentElement;
  const saved = localStorage.getItem("theme");
  if (saved === "dark") root.classList.add("dark");
 
  document.getElementById("theme-toggle").addEventListener("click", () => {
    root.classList.toggle("dark");
    localStorage.setItem("theme", root.classList.contains("dark") ? "dark" : "light");
  });
</script>
</body>
</html>
